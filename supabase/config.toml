# Supabase local development configuration.
# Lets anyone run the full stack locally with the Supabase CLI:
#   supabase start   &&   supabase db reset
# No secrets live here; local dev keys are generated by the CLI.

project_id = "journee"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Local-only default; override per environment. Never commit production URLs.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[analytics]
enabled = false
