name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: this workflow only reads the repository, so the
# automatically-provided GITHUB_TOKEN is scoped to read-only. Any future job
# that needs to write (e.g. publish, comment) must opt in explicitly. This is
# the SOC 2 "least privilege" control (CC6.1) applied to CI credentials.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # End-to-end smoke: starts the server and asserts key routes/APIs return
      # expected statuses (catches integration regressions build/tests miss).
      - name: Smoke
        run: npm run smoke

      # Dependency scanning (SOC 2 direction). Fails only on high/critical so
      # known moderate advisories don't block; review them in PRs regardless.
      - name: Dependency audit
        run: npm audit --audit-level=high
