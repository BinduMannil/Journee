# Secret scanning (gitleaks).
#
# What this is, in plain terms: gitleaks reads the code and the git history
# looking for things that look like leaked credentials — API keys, tokens,
# private keys, passwords. If it finds one, the check fails so the secret can be
# rotated and removed before it spreads further.
#
# Why it exists: the single highest-impact security mistake a repo can make is
# committing a real secret. SOC 2 expects a control that prevents and detects
# this (Common Criteria CC6.1 "logical access / protect credentials" and CC7.1
# "detect"). This complements — and does not replace — GitHub's native Secret
# Scanning + Push Protection, which should also be enabled in repo settings
# (see docs/compliance/gap-analysis-and-roadmap.md).
#
# This repo is designed to never hold secrets: .gitignore excludes all .env*
# files and .env.example contains placeholders only. This scan keeps it that way.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history re-scan.
    - cron: "0 8 * * 1"

# Least privilege: only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 pulls the entire history so secrets committed in the
          # past — not just in this change — are detected.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
